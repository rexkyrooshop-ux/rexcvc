name: Build Rexcvc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      - name: Check project files
        run: |
          echo "=== FILES ==="
          ls -la

          echo "=== ICON ==="
          ls -lh rexcvc-icon-final.png

          echo "=== FRONTEND ==="
          ls -lh index.html

          echo "=== SERVER ==="
          ls -lh server.js


      - name: Prepare frontend
        run: |
          rm -rf public
          mkdir -p public

          cp index.html public/index.html

          if [ -f config.js ]; then
            cp config.js public/config.js
          fi


      - name: Install dependencies
        run: |
          npm install --include=dev


      - name: Install Capacitor
        run: |
          npm install --no-save \
            @capacitor/cli@8 \
            @capacitor/core@8 \
            @capacitor/android@8 \
            typescript@5.9.2


      - name: Check Capacitor
        run: |
          npx cap --version
          npx tsc --version


      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Android
        run: |
          npx cap sync android


      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      - name: Generate Android icons
        run: |

          ICON="rexcvc-icon-final.png"

          echo "Using icon:"
          ls -lh "$ICON"

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          magick "$ICON" \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          magick "$ICON" \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          magick "$ICON" \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          magick "$ICON" \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          magick "$ICON" \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


      - name: Generate round icons
        run: |

          cp \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


      - name: Remove adaptive icons
        run: |

          rm -f \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          rm -f \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      - name: Verify icons
        run: |

          echo "=== GENERATED ICONS ==="

          find android/app/src/main/res \
            -name "ic_launcher*.png" \
            -type f \
            -print


      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rexcvc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Publish APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Rexcvc APK
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
