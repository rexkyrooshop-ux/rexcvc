<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rexcvc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #f5f5f5;
    }

    body {
      min-height: 100vh;

      font-family: "DM Sans", sans-serif;

      color: #17181b;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 8% 0%,
          rgba(0,0,0,.045),
          transparent 25%
        ),
        radial-gradient(
          circle at 95% 30%,
          rgba(0,0,0,.035),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f5f6f7 55%,
          #ffffff 100%
        );
    }


    /* =====================================================
       BACKGROUND GRID
    ===================================================== */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      z-index: -3;

      pointer-events: none;

      opacity: .42;

      background-image:
        linear-gradient(
          rgba(80,80,80,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(80,80,80,.035) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      mask-image:
        linear-gradient(
          to bottom,
          black 0%,
          rgba(0,0,0,.7) 45%,
          transparent 90%
        );
    }


    /* =====================================================
       BACKGROUND CIRCLES
    ===================================================== */

    .bg-orb {
      position: fixed;

      border-radius: 50%;

      pointer-events: none;

      z-index: -2;
    }

    .orb-one {
      width: 220px;
      height: 220px;

      left: -140px;
      top: 25%;

      border:
        1px solid rgba(0,0,0,.08);

      box-shadow:
        0 0 0 35px rgba(0,0,0,.018),
        0 0 0 70px rgba(0,0,0,.01);
    }

    .orb-two {
      width: 280px;
      height: 280px;

      right: -180px;
      top: 55%;

      border:
        1px solid rgba(0,0,0,.08);

      box-shadow:
        0 0 0 40px rgba(0,0,0,.018),
        0 0 0 80px rgba(0,0,0,.01);
    }


    /* =====================================================
       SPLASH SCREEN
    ===================================================== */

    .splash {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #f3f4f5 100%
        );

      pointer-events: none;

      animation:
        splashHide .7s ease 2.5s forwards;
    }


    .splash-grid {
      position: absolute;

      inset: 0;

      opacity: .35;

      background-image:
        linear-gradient(
          rgba(0,0,0,.04) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0,0,0,.04) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
    }


    .splash-ring {
      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      border:
        1px solid rgba(0,0,0,.12);

      animation:
        ringExpand 1.8s ease forwards;
    }


    .splash-ring::before {
      content: "";

      position: absolute;

      inset: 23px;

      border-radius: 50%;

      border:
        1px solid rgba(0,0,0,.08);
    }


    .splash-logo {
      position: relative;

      z-index: 2;

      font-family: "Bebas Neue", sans-serif;

      font-size:
        clamp(70px, 20vw, 125px);

      line-height: .85;

      letter-spacing: 5px;

      color: #17181b;

      opacity: 0;

      transform:
        translateY(140px)
        scale(.72);

      text-shadow:
        0 12px 35px rgba(0,0,0,.08);

      animation:
        logoEnter 1.25s cubic-bezier(.16,1,.3,1) .1s forwards,
        logoExit .65s ease 1.8s forwards;
    }


    @keyframes logoEnter {

      0% {
        opacity: 0;

        transform:
          translateY(140px)
          scale(.72);
      }

      55% {
        opacity: 1;

        transform:
          translateY(-10px)
          scale(1.06);
      }

      75% {
        transform:
          translateY(3px)
          scale(.98);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes logoExit {

      from {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

      to {
        opacity: 0;

        transform:
          translateY(-45px)
          scale(1.08);
      }
    }


    @keyframes ringExpand {

      0% {
        opacity: 0;

        transform:
          scale(.45);
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          scale(2.35);
      }
    }


    @keyframes splashHide {

      to {
        opacity: 0;
        visibility: hidden;
      }
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width: 100%;

      min-height: 100vh;

      padding:
        38px
        15px
        35px;

      opacity: 0;

      animation:
        pageShow .7s ease 2.6s forwards;
    }


    @keyframes pageShow {

      from {
        opacity: 0;

        transform:
          translateY(20px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .container {
      width: 100%;

      max-width: 760px;

      margin: 0 auto;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      text-align: center;

      margin-bottom: 31px;
    }


    .mini-label {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px
        13px;

      margin-bottom: 13px;

      border:
        1px solid #dedfe1;

      border-radius: 100px;

      background:
        rgba(255,255,255,.75);

      color: #74777c;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1.6px;

      box-shadow:
        0 5px 18px rgba(0,0,0,.035);
    }


    .mini-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #17181b;

      box-shadow:
        0 0 0 4px rgba(0,0,0,.055);
    }


    .brand {
      font-family: "Bebas Neue", sans-serif;

      font-size: 64px;

      line-height: .9;

      letter-spacing: 2px;

      color: #17181b;
    }


    .brand span {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin-left: 4px;

      border-radius: 50%;

      background: #17181b;
    }


    .subtitle {
      max-width: 430px;

      margin:
        14px
        auto
        0;

      color: #7d8085;

      font-size: 13px;

      line-height: 1.65;

      font-weight: 500;
    }


    /* =====================================================
       CARDS
    ===================================================== */

    .cards {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }


    .card {
      position: relative;

      padding: 22px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.98),
          rgba(247,248,249,.95)
        );

      border:
        1px solid #dedfe1;

      border-radius: 25px;

      box-shadow:
        0 16px 42px rgba(0,0,0,.06);

      transition:
        transform .22s ease,
        box-shadow .22s ease;
    }


    .card:hover {
      transform:
        translateY(-3px);

      box-shadow:
        0 22px 48px rgba(0,0,0,.085);
    }


    .card::before {
      content: "";

      position: absolute;

      top: 0;

      left: 25px;
      right: 25px;

      height: 2px;

      border-radius:
        0 0 10px 10px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #85878a,
          #17181b,
          #85878a,
          transparent
        );

      opacity: .7;
    }


    .card::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      right: -90px;
      top: -90px;

      border-radius: 50%;

      border:
        1px solid rgba(0,0,0,.09);

      box-shadow:
        0 0 0 22px rgba(0,0,0,.018),
        0 0 0 44px rgba(0,0,0,.01);

      pointer-events: none;
    }


    /* =====================================================
       CARD TOP
    ===================================================== */

    .card-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;
    }


    .number {
      font-family: "Bebas Neue", sans-serif;

      font-size: 23px;

      letter-spacing: 1px;

      color: #b1b3b6;
    }


    .arrow {
      width: 31px;
      height: 31px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid #dfe0e2;

      border-radius: 50%;

      background:
        #ffffff;

      color: #85888d;

      font-size: 14px;
    }


    /* =====================================================
       PLATFORM
       TANPA ICON / TANPA BATANG
    ===================================================== */

    .platform {
      display: flex;

      align-items: center;

      margin-bottom: 18px;
    }


    .platform-name {
      font-size: 21px;

      font-weight: 800;

      letter-spacing: -.6px;

      color: #191a1d;
    }


    .platform-info {
      margin-top: 3px;

      color: #999b9f;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 1.25px;
    }


    /* =====================================================
       INPUT
    ===================================================== */

    .input-row {
      display: flex;

      align-items: center;

      min-height: 58px;

      padding:
        5px
        5px
        5px
        17px;

      background:
        #f0f1f2;

      border:
        1px solid #dedfe2;

      border-radius: 16px;

      transition:
        .2s ease;
    }


    .input-row:focus-within {
      background:
        #ffffff;

      border-color:
        #bfc1c5;

      box-shadow:
        0 0 0 4px rgba(0,0,0,.035);
    }


    .input-row input {
      width: 100%;

      min-width: 0;

      border: none;

      outline: none;

      background: transparent;

      color: #191a1d;

      font-family: inherit;

      font-size: 13px;

      font-weight: 500;
    }


    .input-row input::placeholder {
      color: #999b9f;
    }


    /* =====================================================
       3D BUTTON
       ABU MUDA -> ABU TUA -> HITAM DI BAWAH
    ===================================================== */

    .paste,
    .process {
      position: relative;

      background:
        linear-gradient(
          180deg,
          #aeb1b5 0%,
          #979a9f 42%,
          #74777c 100%
        );

      color: #ffffff;

      border:
        1px solid #bfc1c5;

      font-family: inherit;

      cursor: pointer;

      box-shadow:
        0 5px 0 #151619,
        0 9px 16px rgba(0,0,0,.13),
        inset 0 1px 0 rgba(255,255,255,.42);

      transition:
        transform .12s ease,
        box-shadow .12s ease,
        background .18s ease;
    }


    /* highlight tipis */

    .paste::before,
    .process::before {
      content: "";

      position: absolute;

      left: 12px;
      right: 12px;

      top: 5px;

      height: 1px;

      background:
        rgba(255,255,255,.30);

      border-radius: 10px;

      pointer-events: none;
    }


    /* hover */

    .paste:hover,
    .process:hover {
      background:
        linear-gradient(
          180deg,
          #b7babd 0%,
          #9b9ea3 42%,
          #6d7075 100%
        );

      box-shadow:
        0 5px 0 #111214,
        0 12px 20px rgba(0,0,0,.17),
        inset 0 1px 0 rgba(255,255,255,.48);
    }


    /* pressed */

    .paste:active,
    .process:active {
      transform:
        translateY(4px);

      box-shadow:
        0 1px 0 #151619,
        0 3px 7px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.30);
    }


    /* =====================================================
       PASTE BUTTON
    ===================================================== */

    .paste {
      flex-shrink: 0;

      height: 46px;

      padding:
        0
        18px;

      border-radius:
        11px;

      font-size: 12px;

      font-weight: 800;
    }


    /* =====================================================
       PROCESS BUTTON
    ===================================================== */

    .process {
      width: 100%;

      height: 55px;

      margin-top: 13px;

      border-radius:
        14px;

      font-size: 13px;

      font-weight: 800;

      letter-spacing: .2px;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      min-height: 16px;

      margin-top: 9px;

      text-align: center;

      color: #898c91;

      font-size: 11px;

      font-weight: 500;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding-top: 26px;

      color: #a1a4a8;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: .6px;
    }


    .footer-line {
      width: 25px;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #cfd0d2
        );
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 520px) {

      .page {
        padding:
          30px
          13px
          25px;
      }


      .brand {
        font-size: 56px;
      }


      .subtitle {
        padding:
          0
          17px;

        font-size: 12px;
      }


      .card {
        padding: 19px;

        border-radius: 22px;
      }


      .card::before {
        left: 22px;
        right: 22px;
      }


      .platform-name {
        font-size: 19px;
      }


      .input-row {
        min-height: 55px;
      }


      .paste {
        height: 45px;

        padding:
          0
          15px;
      }


      .process {
        height: 53px;
      }


      .splash-logo {
        letter-spacing: 4px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       BACKGROUND
  ===================================================== -->

  <div class="bg-orb orb-one"></div>

  <div class="bg-orb orb-two"></div>



  <!-- =====================================================
       SPLASH
  ===================================================== -->

  <div class="splash">

    <div class="splash-grid"></div>

    <div class="splash-ring"></div>

    <div class="splash-logo">
      REXCVC
    </div>

  </div>



  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main class="page">

    <div class="container">


      <!-- =================================================
           HEADER
      ================================================= -->

      <header class="header">

        <div class="mini-label">

          <span class="mini-dot"></span>

          READY TO DOWNLOAD

        </div>


        <div class="brand">

          REXCVC<span></span>

        </div>


        <p class="subtitle">

          Download video yang kamu punya hak
          untuk mengunduh.

        </p>

      </header>



      <!-- =================================================
           CARDS
      ================================================= -->

      <section class="cards">


        <!-- =================================================
             TIKTOK
        ================================================= -->

        <article class="card">

          <div class="card-top">

            <div class="number">
              01
            </div>

            <div class="arrow">
              ↗
            </div>

          </div>


          <div class="platform">

            <div>

              <div class="platform-name">
                TikTok
              </div>

              <div class="platform-info">
                VIDEO DOWNLOADER
              </div>

            </div>

          </div>


          <div class="input-row">

            <input
              id="tiktokInput"
              type="url"
              placeholder="Tempel link TikTok di sini..."
              autocomplete="off"
            >

            <button
              class="paste"
              onclick="pasteLink(
                'tiktokInput',
                'tiktokStatus'
              )"
            >
              Tempel
            </button>

          </div>


          <button
            class="process"
            onclick="processLink(
              'tiktokInput',
              'tiktokStatus'
            )"
          >
            Proses TikTok
          </button>


          <div
            class="status"
            id="tiktokStatus"
          ></div>

        </article>



        <!-- =================================================
             INSTAGRAM
        ================================================= -->

        <article class="card">

          <div class="card-top">

            <div class="number">
              02
            </div>

            <div class="arrow">
              ↗
            </div>

          </div>


          <div class="platform">

            <div>

              <div class="platform-name">
                Instagram
              </div>

              <div class="platform-info">
                VIDEO DOWNLOADER
              </div>

            </div>

          </div>


          <div class="input-row">

            <input
              id="instagramInput"
              type="url"
              placeholder="Tempel link Instagram di sini..."
              autocomplete="off"
            >

            <button
              class="paste"
              onclick="pasteLink(
                'instagramInput',
                'instagramStatus'
              )"
            >
              Tempel
            </button>

          </div>


          <button
            class="process"
            onclick="processLink(
              'instagramInput',
              'instagramStatus'
            )"
          >
            Proses Instagram
          </button>


          <div
            class="status"
            id="instagramStatus"
          ></div>

        </article>



        <!-- =================================================
             YOUTUBE
        ================================================= -->

        <article class="card">

          <div class="card-top">

            <div class="number">
              03
            </div>

            <div class="arrow">
              ↗
            </div>

          </div>


       >
