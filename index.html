<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Rexcvc</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #000000;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       SPLASH SCREEN
    ========================= */

    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .splash-title {
      color: #000000;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 7px;
      animation: splashText 1.4s ease-in-out infinite alternate;
    }

    .splash-subtitle {
      color: #000000;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 5px;
      margin-top: 12px;
      opacity: 0.6;
      animation: splashFade 1.4s ease-in-out infinite alternate;
    }

    .splash-line {
      width: 90px;
      height: 2px;
      background: #000000;
      margin-top: 22px;
      animation: splashLine 1.4s ease-in-out infinite alternate;
    }

    @keyframes splashText {
      from {
        opacity: 0.3;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splashFade {
      from {
        opacity: 0.2;
      }

      to {
        opacity: 0.8;
      }
    }

    @keyframes splashLine {
      from {
        width: 30px;
        opacity: 0.2;
      }

      to {
        width: 110px;
        opacity: 1;
      }
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      background: #ffffff;
      padding: 28px 18px 40px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      padding: 18px 4px 24px;
    }

    .brand {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #000000;
    }

    .tagline {
      margin-top: 7px;
      font-size: 12px;
      color: #666666;
      letter-spacing: 2px;
    }

    /* =========================
       INPUT
    ========================= */

    .input-box {
      width: 100%;
      background: #f5f5f5;
      border: 1px solid #dcdcdc;
      border-radius: 18px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .input-box input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 0;
      outline: none;
      background: transparent;
      color: #000000;
      font-size: 14px;
      padding: 0 12px;
    }

    .input-box input::placeholder {
      color: #999999;
    }

    .paste-btn {
      height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 13px;
      background: #dedede;
      color: #000000;
      font-weight: 800;
      font-size: 12px;
      box-shadow: 0 4px 0 #999999;
      cursor: pointer;
    }

    .paste-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #999999;
    }

    /* =========================
       PLATFORM CARDS
    ========================= */

    .platforms {
      display: grid;
      gap: 14px;
    }

    .platform-card {
      position: relative;
      width: 100%;
      min-height: 108px;
      padding: 22px;
      border-radius: 22px;
      background: #f8f8f8;
      border: 1px solid #dedede;
      box-shadow: 0 7px 0 #bdbdbd;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .platform-card:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #bdbdbd;
    }

    .platform-name {
      font-size: 21px;
      font-weight: 900;
      color: #000000;
      letter-spacing: 1px;
    }

    .platform-desc {
      margin-top: 7px;
      font-size: 12px;
      color: #777777;
    }

    .platform-arrow {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 26px;
      font-weight: 900;
      color: #000000;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f3f3f3;
      border: 1px solid #dddddd;
      font-size: 13px;
      line-height: 1.5;
      color: #222222;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #b00020;
      background: #fff5f5;
      border-color: #ffcaca;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 20px;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .loading.show {
      display: flex;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #000000;
      animation: loadingDot 0.9s infinite alternate;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes loadingDot {
      from {
        opacity: 0.2;
        transform: translateY(0);
      }

      to {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      margin-top: 34px;
      color: #999999;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 380px) {
      .brand {
        font-size: 28px;
      }

      .splash-title {
        font-size: 36px;
      }

      .paste-btn {
        padding: 0 12px;
      }

      .platform-card {
        min-height: 100px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SPLASH
  ========================= -->

  <div class="splash" id="splash">
    <div class="splash-title">REXCVC</div>
    <div class="splash-subtitle">VIDEO DOWNLOADER</div>
    <div class="splash-line"></div>
  </div>

  <!-- =========================
       APP
  ========================= -->

  <main class="app">
    <div class="container">

      <header class="header">
        <div class="brand">REXCVC</div>
        <div class="tagline">FAST · SIMPLE · CLEAN</div>
      </header>

      <!-- URL INPUT -->

      <div class="input-box">
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Tempel link video di sini..."
        />

        <button
          class="paste-btn"
          type="button"
          onclick="pasteLink()"
        >
          PASTE
        </button>
      </div>

      <!-- PLATFORM -->

      <div class="platforms">

        <div
          class="platform-card"
          onclick="selectPlatform('tiktok')"
        >
          <div class="platform-name">TikTok</div>
          <div class="platform-desc">
            Download video TikTok
          </div>
          <div class="platform-arrow">›</div>
        </div>

        <div
          class="platform-card"
          onclick="selectPlatform('instagram')"
        >
          <div class="platform-name">Instagram</div>
          <div class="platform-desc">
            Download video Instagram
          </div>
          <div class="platform-arrow">›</div>
        </div>

        <div
          class="platform-card"
          onclick="selectPlatform('youtube')"
        >
          <div class="platform-name">YouTube</div>
          <div class="platform-desc">
            Download video YouTube
          </div>
          <div class="platform-arrow">›</div>
        </div>

      </div>

      <!-- LOADING -->

      <div class="loading" id="loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>MEMPROSES</span>
      </div>

      <!-- STATUS -->

      <div class="status" id="status"></div>

      <div class="footer">
        REXCVC DOWNLOADER
      </div>

    </div>
  </main>

  <!-- Capacitor clipboard bridge -->
  <script src="clipboard-bridge.js"></script>

  <script>
    const API_BASE = "https://rexcvc-f1l1rbr.cranl.net";

    const input = document.getElementById("urlInput");
    const statusBox = document.getElementById("status");
    const loading = document.getElementById("loading");
    const splash = document.getElementById("splash");

    /* =========================
       SPLASH
    ========================= */

    window.addEventListener("load", () => {
      setTimeout(() => {
        splash.classList.add("hide");
      }, 1800);
    });

    /* =========================
       STATUS
    ========================= */

    function showStatus(message, error = false) {
      statusBox.textContent = message;
      statusBox.classList.add("show");

      if (error) {
        statusBox.classList.add("error");
      } else {
        statusBox.classList.remove("error");
      }
    }

    function hideStatus() {
      statusBox.classList.remove("show");
      statusBox.classList.remove("error");
    }

    function setLoading(active) {
      if (active) {
        loading.classList.add("show");
      } else {
        loading.classList.remove("show");
      }
    }

    /* =========================
       PLATFORM DETECTION
    ========================= */

    function getPlatform(value) {
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();

        if (
          host === "youtube.com" ||
          host === "www.youtube.com" ||
          host === "m.youtube.com" ||
          host === "youtu.be"
        ) {
          return "youtube";
        }

        if (
          host === "tiktok.com" ||
          host === "www.tiktok.com" ||
          host === "vm.tiktok.com" ||
          host === "vt.tiktok.com"
        ) {
          return "tiktok";
        }

        if (
          host === "instagram.com" ||
          host === "www.instagram.com"
        ) {
          return "instagram";
        }

        return null;
      } catch {
        return null;
      }
    }

    /* =========================
       PASTE
    ========================= */

    async function pasteLink() {
      hideStatus();

      try {
        if (
          window.RexcvcClipboard &&
          typeof window.RexcvcClipboard.read === "function"
        ) {
          const result = await window.RexcvcClipboard.read();

          if (result && result.value) {
            input.value = result.value;
            showStatus("Link berhasil ditempel.");
            return;
          }
        }
      } catch (error) {
        console.log("Capacitor clipboard gagal:", error);
      }

      try {
        if (
          navigator.clipboard &&
          typeof navigator.clipboard.readText === "function"
        ) {
          const text = await navigator.clipboard.readText();

          if (text) {
            input.value = text;
            showStatus("Link berhasil ditempel.");
            return;
          }
        }
      } catch (error) {
        console.log("Browser clipboard gagal:", error);
      }

      input.focus();

      showStatus(
        "Clipboard tidak bisa dibaca otomatis. Tekan lama pada kolom link lalu pilih Tempel."
      );
    }

    /* =========================
       SELECT PLATFORM
    ========================= */

    async function selectPlatform(platform) {
      const url = input.value.trim();

      if (!url) {
        input.focus();

        showStatus(
          "Masukkan atau tempel link video terlebih dahulu.",
          true
        );

        return;
      }

      const detected = getPlatform(url);

      if (!detected) {
        showStatus(
          "Link tidak dikenali. Gunakan link TikTok, Instagram, atau YouTube.",
          true
        );

        return;
      }

      if (detected !== platform) {
        showStatus(
          "Link tersebut terdeteksi sebagai " +
          detected.toUpperCase() +
          ".",
          true
        );

        return;
      }

      await downloadVideo(url);
    }

    /* =========================
       DOWNLOAD
    ========================= */

    async function downloadVideo(url) {
      hideStatus();
      setLoading(true);

      try {
        const infoResponse = await fetch(
          API_BASE + "/api/info",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: url
            })
          }
        );

        if (!infoResponse.ok) {
          let errorMessage =
            "Gagal mengambil informasi video.";

          try {
            const errorData = await infoResponse.json();

            if (errorData && errorData.error) {
              errorMessage = errorData.error;
            }
          } catch {}

          throw new Error(errorMessage);
        }

        const info = await infoResponse.json();

        showStatus(
          "Video ditemukan: " +
          (info.title || "Rexcvc Video") +
          ". Memulai download..."
        );

        const downloadUrl =
          API_BASE +
          "/api/download?url=" +
          encodeURIComponent(url);

        const downloadResponse = await fetch(downloadUrl);

        if (!downloadResponse.ok) {
          let errorMessage =
            "Gagal mengunduh video.";

          try {
            const errorData =
              await downloadResponse.json();

            if (errorData && errorData.error) {
              errorMessage = errorData.error;
            }
          } catch {}

          throw new Error(errorMessage);
        }

        const blob = await downloadResponse.blob();

        if (!blob || blob.size === 0) {
          throw new Error("File video kosong.");
        }

        const blobUrl =
          window.URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = blobUrl;
        link.download = "Rexcvc-Video.mp4";
        link.style.display = "none";

        document.body.appendChild(link);

        link.click();

        setTimeout(() => {
          link.remove();
          window.URL.revokeObjectURL(blobUrl);
        }, 2000);

        showStatus(
          "Download selesai. File disimpan sebagai Rexcvc-Video.mp4."
        );

      } catch (error) {
        console.error("DOWNLOAD ERROR:", error);

        let message =
          error && error.message
            ? error.message
            : "Gagal mengunduh video.";

        if (
          message.toLowerCase().includes("failed to fetch")
        ) {
          message =
            "Tidak dapat terhubung ke server Rexcvc. Coba lagi beberapa saat.";
        }

        showStatus(message, true);

      } finally {
        setLoading(false);
      }
    }
  </script>

</body>
</html>
