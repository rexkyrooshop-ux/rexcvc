<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>REXCVC Downloader</title>

  <meta
    name="description"
    content="REXCVC video downloader untuk TikTok, Instagram, dan YouTube."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: #111;
      background:
        radial-gradient(circle at 50% 0%, rgba(0,0,0,.055), transparent 35%),
        linear-gradient(135deg, #ffffff 0%, #f1f1f1 48%, #ffffff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image:
        linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 0 20px 45px;
    }

    /* SPLASH */

    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      animation: splashOut 1.8s ease forwards;
      pointer-events: none;
    }

    .splash-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(70px, 20vw, 170px);
      letter-spacing: .06em;
      line-height: .8;
      transform: translateY(90px) scale(.82);
      opacity: 0;
      animation: splashTitle 1.15s cubic-bezier(.2,.75,.2,1) .15s forwards;
    }

    @keyframes splashTitle {
      0% {
        opacity: 0;
        transform: translateY(100px) scale(.8);
      }

      45% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes splashOut {
      0%, 70% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* HEADER */

    header {
      padding: 42px 4px 26px;
      text-align: center;
    }

    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(54px, 15vw, 92px);
      letter-spacing: .08em;
      line-height: .85;
    }

    .mini-label {
      margin-top: 13px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .28em;
      color: #777;
    }

    .line {
      width: 72px;
      height: 3px;
      margin: 22px auto 0;
      background: #111;
      border-radius: 99px;
    }

    /* INTRO */

    .intro {
      margin: 0 0 28px;
      text-align: center;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 38px);
      letter-spacing: -.04em;
    }

    .intro p {
      margin: 10px auto 0;
      max-width: 520px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    /* PLATFORM CARD */

    .platform-card {
      position: relative;
      margin-bottom: 22px;
      padding: 24px;
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 25px;
      background: rgba(255,255,255,.78);
      box-shadow:
        0 15px 45px rgba(0,0,0,.07),
        inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter: blur(14px);
    }

    .platform-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 5px;
    }

    .platform-desc {
      color: #777;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      outline: none;
      background: #f7f7f7;
      color: #111;
      font-family: inherit;
      font-size: 14px;
      transition: .2s ease;
    }

    input:focus {
      border-color: #111;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    /* PHYSICAL BUTTON */

    .btn {
      position: relative;
      min-height: 52px;
      padding: 0 18px;
      border: 1px solid #bcbcbc;
      border-radius: 14px;
      background:
        linear-gradient(
          180deg,
          #eeeeee 0%,
          #d8d8d8 55%,
          #c6c6c6 100%
        );
      color: #111;
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow:
        0 5px 0 #111,
        0 8px 16px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.95);
      transition: transform .08s ease, box-shadow .08s ease;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 #111,
        0 3px 8px rgba(0,0,0,.1),
        inset 0 1px 0 rgba(255,255,255,.8);
    }

    .paste-btn {
      flex: 0 0 auto;
    }

    .download-btn {
      width: 100%;
      margin-top: 5px;
      font-size: 14px;
      letter-spacing: .02em;
    }

    .download-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow:
        0 5px 0 #111,
        0 8px 16px rgba(0,0,0,.08);
    }

    .status {
      min-height: 19px;
      margin-top: 10px;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
    }

    .status.active {
      color: #111;
    }

    .status.error {
      color: #a00000;
    }

    /* FOOTER */

    footer {
      padding: 22px 5px 0;
      text-align: center;
      color: #999;
      font-size: 10px;
      letter-spacing: .08em;
    }

    /* RESPONSIVE */

    @media (max-width: 520px) {
      .page {
        padding-left: 15px;
        padding-right: 15px;
      }

      .platform-card {
        padding: 19px;
        border-radius: 21px;
      }

      .input-row {
        gap: 7px;
      }

      input {
        font-size: 13px;
      }

      .paste-btn {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="splash">
    <div class="splash-title">REXCVC</div>
  </div>

  <main class="page">

    <header>
      <div class="brand">REXCVC</div>
      <div class="mini-label">READY TO DOWNLOAD</div>
      <div class="line"></div>
    </header>

    <section class="intro">
      <h1>Video Downloader</h1>
      <p>
        Download video dari TikTok, Instagram, dan YouTube
        melalui REXCVC.
      </p>
    </section>

    <!-- TIKTOK -->

    <section class="platform-card">

      <div class="platform-name">TikTok</div>

      <div class="platform-desc">
        Tempel link video TikTok kamu.
      </div>

      <div class="input-row">
        <input
          id="tiktokInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          placeholder="https://www.tiktok.com/..."
        >

        <button
          class="btn paste-btn"
          type="button"
          onclick="pasteLink('tiktokInput', 'tiktokStatus')"
        >
          Paste
        </button>
      </div>

      <button
        id="tiktokDownload"
        class="btn download-btn"
        type="button"
        onclick="downloadVideo('tiktokInput', 'tiktokStatus', this)"
      >
        Download
      </button>

      <div id="tiktokStatus" class="status"></div>

    </section>

    <!-- INSTAGRAM -->

    <section class="platform-card">

      <div class="platform-name">Instagram</div>

      <div class="platform-desc">
        Tempel link Reel atau video Instagram.
      </div>

      <div class="input-row">
        <input
          id="instagramInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          placeholder="https://www.instagram.com/..."
        >

        <button
          class="btn paste-btn"
          type="button"
          onclick="pasteLink('instagramInput', 'instagramStatus')"
        >
          Paste
        </button>
      </div>

      <button
        id="instagramDownload"
        class="btn download-btn"
        type="button"
        onclick="downloadVideo('instagramInput', 'instagramStatus', this)"
      >
        Download
      </button>

      <div id="instagramStatus" class="status"></div>

    </section>

    <!-- YOUTUBE -->

    <section class="platform-card">

      <div class="platform-name">YouTube</div>

      <div class="platform-desc">
        Tempel link video YouTube.
      </div>

      <div class="input-row">
        <input
          id="youtubeInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          placeholder="https://www.youtube.com/watch?v=..."
        >

        <button
          class="btn paste-btn"
          type="button"
          onclick="pasteLink('youtubeInput', 'youtubeStatus')"
        >
          Paste
        </button>
      </div>

      <button
        id="youtubeDownload"
        class="btn download-btn"
        type="button"
        onclick="downloadVideo('youtubeInput', 'youtubeStatus', this)"
      >
        Download
      </button>

      <div id="youtubeStatus" class="status"></div>

    </section>

    <footer>
      REXCVC • VIDEO DOWNLOADER
    </footer>

  </main>

  <script>

    /*
      BACKEND REXCVC
    */

    const API_BASE =
      "https://rexcvc-f11rbr.cranl.net";


    /*
      PASTE CLIPBOARD
    */

    async function pasteLink(inputId, statusId) {

      const input =
        document.getElementById(inputId);

      const status =
        document.getElementById(statusId);

      try {

        if (!navigator.clipboard) {
          throw new Error("Clipboard tidak tersedia.");
        }

        const text =
          await navigator.clipboard.readText();

        if (!text) {
          status.textContent =
            "Clipboard kosong.";

          return;
        }

        input.value =
          text.trim();

        status.className =
          "status active";

        status.textContent =
          "Link berhasil ditempel.";

      } catch (error) {

        status.className =
          "status error";

        status.textContent =
          "Clipboard tidak tersedia. Paste link secara manual.";

        input.focus();
      }
    }


    /*
      CHECK URL
    */

    function isSupportedUrl(value) {

      try {

        const url =
          new URL(value);

        if (url.protocol !== "https:") {
          return false;
        }

        const host =
          url.hostname.toLowerCase();

        const allowed = [
          "youtube.com",
          "www.youtube.com",
          "m.youtube.com",
          "youtu.be",
          "tiktok.com",
          "www.tiktok.com",
          "vm.tiktok.com",
          "instagram.com",
          "www.instagram.com"
        ];

        return allowed.some(
          item =>
            host === item ||
            host.endsWith("." + item)
        );

      } catch {

        return false;
      }
    }


    /*
      DOWNLOAD VIDEO
    */

    async function downloadVideo(
      inputId,
      statusId,
      button
    ) {

      const input =
        document.getElementById(inputId);

      const status =
        document.getElementById(statusId);

      const url =
        input.value.trim();


      if (!url) {

        status.className =
          "status error";

        status.textContent =
          "Masukkan link terlebih dahulu.";

        input.focus();

        return;
      }


      if (!isSupportedUrl(url)) {

        status.className =
          "status error";

        status.textContent =
          "Link harus berasal dari TikTok, Instagram, atau YouTube.";

        return;
      }


      button.disabled = true;

      status.className =
        "status active";

      status.textContent =
        "Menyiapkan download...";


      try {

        /*
          Endpoint download backend.
        */

        const downloadUrl =
          API_BASE +
          "/api/download?url=" +
          encodeURIComponent(url);


        /*
          Buka endpoint download.
          Backend akan mengirim file MP4
          dengan nama Rexcvc-Video.mp4.
        */

        const newWindow =
          window.open(
            downloadUrl,
            "_blank"
          );


        /*
          Beberapa WebView memblokir
          window.open. Jika itu terjadi,
          navigasikan halaman secara langsung.
        */

        if (!newWindow) {
          window.location.href =
            downloadUrl;
        }


        status.textContent =
          "Download sedang diproses. Tunggu sampai file selesai.";

      } catch (error) {

        console.error(error);

        status.className =
          "status error";

        status.textContent =
          "Gagal memulai download. Coba lagi.";
      }


      setTimeout(() => {
        button.disabled = false;
      }, 3000);
    }

  </script>

</body>
</html>
