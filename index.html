<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REXCVC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#17181a;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px 50px}.brand{text-align:center;font-weight:900;letter-spacing:5px;font-size:34px;margin:22px 0 4px}.sub{text-align:center;color:#777;font-size:11px;letter-spacing:3px;margin-bottom:28px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #0000000d}.name{font-size:20px;font-weight:800}.info{font-size:10px;color:#888;letter-spacing:2px;margin-top:4px}.row{display:flex;gap:8px;margin-top:16px}.input{flex:1;min-width:0;padding:14px;border:1px solid #d4d4d4;border-radius:10px;font-size:14px}button{border:0;border-radius:10px;padding:13px 16px;background:linear-gradient(#aaa,#777);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #171717}button:active{transform:translateY(3px);box-shadow:0 1px 0 #171717}.status{font-size:12px;color:#777;margin-top:12px;min-height:18px}.preview{display:none;margin-top:16px;border-top:1px solid #eee;padding-top:16px}.preview img{width:100%;max-height:300px;object-fit:cover;border-radius:12px}.title{font-weight:700;margin:10px 0}.download{display:block;text-align:center;margin-top:12px}.splash{position:fixed;inset:0;background:#f5f5f3;display:flex;align-items:center;justify-content:center;z-index:5;animation:out 1.5s 1.1s forwards}.splash b{font-size:48px;letter-spacing:8px;animation:up 1.2s ease forwards}@keyframes up{from{transform:translateY(90px) scale(.8);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes out{to{opacity:0;visibility:hidden}}
</style></head><body><div class="splash"><b>REXCVC</b></div><main class="wrap"><div class="brand">REXCVC</div><div class="sub">READY TO DOWNLOAD</div>
<script>const API_BASE="REPLACE_WITH_BACKEND_URL";function card(n,label){document.write(`<section class="card"><div class="name">${label}</div><div class="info">VIDEO DOWNLOADER</div><div class="row"><input id="${n}" class="input" placeholder="Tempel link ${label}"><button onclick="paste('${n}','${n}s')">Tempel</button></div><button style="width:100%;margin-top:14px" onclick="processLink('${n}','${n}s','${n}p')">Proses</button><div id="${n}s" class="status"></div><div id="${n}p" class="preview"></div></section>`)}card("tiktok","TikTok");card("instagram","Instagram");card("youtube","YouTube");</script></main>
<script>
async function paste(id,sid){const i=document.getElementById(id),s=document.getElementById(sid);try{const t=await navigator.clipboard.readText();if(!t){s.textContent="Clipboard kosong.";return}i.value=t.trim();s.textContent="Link berhasil ditempel."}catch{s.textContent="Silakan paste link secara manual."}}
async function processLink(id,sid,pid){const url=document.getElementById(id).value.trim(),s=document.getElementById(sid),p=document.getElementById(pid);if(!url){s.textContent="Masukkan link terlebih dahulu.";return}if(API_BASE.includes("REPLACE_")){s.textContent="Backend belum dipasang.";return}s.textContent="Memproses video...";try{const r=await fetch(API_BASE+"/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})}),d=await r.json();if(!r.ok)throw Error(d.error||"Gagal memproses.");p.innerHTML=(d.thumbnail?`<img src="${d.thumbnail}" alt="">`:"")+`<div class="title">${String(d.title||"Video").replace(/[<>&"]/g,"")}</div><a class="download" href="${API_BASE}/api/download?url=${encodeURIComponent(url)}"><button style="width:100%">Download MP4</button></a>`;p.style.display="block";s.textContent="Video siap didownload."}catch(e){s.textContent=e.message}}
</script></body></html>
