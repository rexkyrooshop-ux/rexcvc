<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>REXCVC</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       SPLASH
    ========================= */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: #ffffff;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .splash-title {
      color: #000000;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 7px;

      animation:
        splashPulse 1.2s ease-in-out infinite alternate;
    }

    .splash-subtitle {
      margin-top: 10px;

      color: #000000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;

      opacity: 0.55;
    }

    .splash-line {
      width: 70px;
      height: 2px;

      margin-top: 20px;

      background: #000000;

      animation:
        splashLine 1.2s ease-in-out infinite alternate;
    }

    @keyframes splashPulse {
      from {
        opacity: 0.35;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splashLine {
      from {
        width: 30px;
        opacity: 0.25;
      }

      to {
        width: 110px;
        opacity: 1;
      }
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      min-height: 100vh;

      padding:
        24px
        18px
        40px;

      background: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      padding:
        10px
        2px
        25px;
    }

    .logo-text {
      color: #000000;

      font-size: 32px;
      font-weight: 900;

      letter-spacing: 4px;
    }

    .tagline {
      margin-top: 7px;

      color: #777777;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 2px;
    }

    /* =========================
       INPUT
    ========================= */

    .input-wrapper {
      display: flex;
      align-items: center;

      width: 100%;

      padding: 6px;

      background: #f4f4f4;

      border: 1px solid #dddddd;
      border-radius: 18px;
    }

    #urlInput {
      flex: 1;

      width: 100%;
      min-width: 0;
      height: 48px;

      padding:
        0
        12px;

      border: 0;
      outline: none;

      background: transparent;

      color: #000000;

      font-size: 14px;
    }

    #urlInput::placeholder {
      color: #999999;
    }

    .paste-button {
      flex-shrink: 0;

      height: 46px;

      padding:
        0
        16px;

      border: 0;
      border-radius: 13px;

      background: #dddddd;

      color: #000000;

      font-size: 12px;
      font-weight: 900;

      box-shadow:
        0 4px 0 #999999;

      cursor: pointer;
    }

    .paste-button:active {
      transform: translateY(3px);

      box-shadow:
        0 1px 0 #999999;
    }

    /* =========================
       PLATFORM
    ========================= */

    .platform-list {
      display: flex;
      flex-direction: column;

      gap: 15px;

      margin-top: 20px;
    }

    .platform-button {
      position: relative;

      width: 100%;
      min-height: 110px;

      padding:
        22px;

      border: 1px solid #dddddd;
      border-radius: 22px;

      background: #f8f8f8;

      color: #000000;

      text-align: left;

      box-shadow:
        0 7px 0 #bdbdbd;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        box-shadow 0.1s ease;
    }

    .platform-button:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #bdbdbd;
    }

    .platform-title {
      font-size: 21px;
      font-weight: 900;

      letter-spacing: 0.5px;
    }

    .platform-description {
      margin-top: 8px;

      color: #777777;

      font-size: 12px;
    }

    .arrow {
      position: absolute;

      top: 50%;
      right: 22px;

      transform:
        translateY(-50%);

      color: #000000;

      font-size: 28px;
      font-weight: 900;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      display: none;

      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 24px;

      color: #000000;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    #loading.show {
      display: flex;
    }

    .loading-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #000000;

      animation:
        loadingDot 0.8s infinite alternate;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes loadingDot {
      from {
        opacity: 0.2;
        transform: translateY(0);
      }

      to {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: none;

      width: 100%;

      margin-top: 20px;
      padding: 15px;

      border:
        1px solid #dddddd;

      border-radius: 15px;

      background: #f5f5f5;

      color: #222222;

      font-size: 13px;
      line-height: 1.5;

      word-break: break-word;
    }

    #status.show {
      display: block;
    }

    #status.error {
      background: #fff5f5;
      border-color: #ffcccc;
      color: #a00000;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 35px;

      text-align: center;

      color: #999999;

      font-size: 10px;
      letter-spacing: 2px;
    }

    /* =========================
       SMALL SCREEN
    ========================= */

    @media (max-width: 380px) {
      .logo-text {
        font-size: 28px;
      }

      .splash-title {
        font-size: 36px;
      }

      .paste-button {
        padding:
          0
          12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SPLASH
  ========================= -->

  <div id="splash">

    <div class="splash-title">
      REXCVC
    </div>

    <div class="splash-subtitle">
      VIDEO DOWNLOADER
    </div>

    <div class="splash-line"></div>

  </div>


  <!-- =========================
       MAIN APP
  ========================= -->

  <main class="app">

    <div class="container">

      <!-- HEADER -->

      <header class="header">

        <div class="logo-text">
          REXCVC
        </div>

        <div class="tagline">
          FAST · SIMPLE · CLEAN
        </div>

      </header>


      <!-- URL INPUT -->

      <div class="input-wrapper">

        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Tempel link video di sini..."
        >

        <button
          class="paste-button"
          type="button"
          onclick="pasteLink()"
        >
          PASTE
        </button>

      </div>


      <!-- PLATFORM -->

      <div class="platform-list">

        <button
          class="platform-button"
          type="button"
          onclick="startDownload('tiktok')"
        >

          <div class="platform-title">
            TikTok
          </div>

          <div class="platform-description">
            Download video TikTok
          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <button
          class="platform-button"
          type="button"
          onclick="startDownload('instagram')"
        >

          <div class="platform-title">
            Instagram
          </div>

          <div class="platform-description">
            Download video Instagram
          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <button
          class="platform-button"
          type="button"
          onclick="startDownload('youtube')"
        >

          <div class="platform-title">
            YouTube
          </div>

          <div class="platform-description">
            Download video YouTube
          </div>

          <div class="arrow">
            ›
          </div>

        </button>

      </div>


      <!-- LOADING -->

      <div id="loading">

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

        <span>
          MEMPROSES
        </span>

      </div>


      <!-- STATUS -->

      <div id="status"></div>


      <!-- FOOTER -->

      <div class="footer">
        REXCVC DOWNLOADER
      </div>

    </div>

  </main>


  <script>
    /*
      ==============================
      REXCVC CONFIGURATION
      ==============================
    */

    const API_BASE =
      "https://rexcvc-f1l1rbr.cranl.net";


    /*
      ==============================
      ELEMENTS
      ==============================
    */

    const splash =
      document.getElementById("splash");

    const input =
      document.getElementById("urlInput");

    const loading =
      document.getElementById("loading");

    const statusBox =
      document.getElementById("status");


    /*
      ==============================
      SPLASH
      ==============================
    */

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {

            splash.classList.add("hide");

          },
          1800
        );

      }
    );


    /*
      ==============================
      STATUS
      ==============================
    */

    function showStatus(
      message,
      isError
    ) {

      statusBox.textContent =
        message;

      statusBox.classList.add(
        "show"
      );

      if (isError) {

        statusBox.classList.add(
          "error"
        );

      } else {

        statusBox.classList.remove(
          "error"
        );

      }

    }


    function clearStatus() {

      statusBox.textContent = "";

      statusBox.classList.remove(
        "show"
      );

      statusBox.classList.remove(
        "error"
      );

    }


    /*
      ==============================
      LOADING
      ==============================
    */

    function setLoading(
      value
    ) {

      if (value) {

        loading.classList.add(
          "show"
        );

      } else {

        loading.classList.remove(
          "show"
        );

      }

    }


    /*
      ==============================
      PASTE
      ==============================
    */

    async function pasteLink() {

      clearStatus();

      /*
        Coba Clipboard API
      */

      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.readText
        ) {

          const text =
            await navigator.clipboard.readText();

          if (text) {

            input.value =
              text.trim();

            showStatus(
              "Link berhasil ditempel.",
              false
            );

            return;

          }

        }

      } catch (error) {

        console.log(
          "Clipboard API:",
          error
        );

      }


      /*
        Jika Android WebView
        tidak mengizinkan clipboard,
        arahkan pengguna ke paste manual.
      */

      input.focus();

      showStatus(
        "Tekan lama kolom link lalu pilih Tempel.",
        false
      );

    }


    /*
      ==============================
      PLATFORM DETECTION
      ==============================
    */

    function detectPlatform(
      value
    ) {

      try {

        const url =
          new URL(value);

        const host =
          url.hostname
            .toLowerCase()
            .replace(/^www\./, "");


        /*
          YouTube
        */

        if (
          host === "youtube.com" ||
          host === "youtu.be" ||
          host === "m.youtube.com"
        ) {

          return "youtube";

        }


        /*
          TikTok
        */

        if (
          host === "tiktok.com" ||
          host === "vm.tiktok.com" ||
          host === "vt.tiktok.com"
        ) {

          return "tiktok";

        }


        /*
          Instagram
        */

        if (
          host === "instagram.com"
        ) {

          return "instagram";

        }


        return null;

      } catch {

        return null;

      }

    }


    /*
      ==============================
      DOWNLOAD
      ==============================
    */

    async function startDownload(
      selectedPlatform
    ) {

      clearStatus();

      const url =
        input.value.trim();


      /*
        Cek URL kosong
      */

      if (!url) {

        showStatus(
          "Masukkan link video terlebih dahulu.",
          true
        );

        input.focus();

        return;

      }


      /*
        Cek URL valid
      */

      const detectedPlatform =
        detectPlatform(url);


      if (!detectedPlatform) {

        showStatus(
          "Link tidak dikenali. Gunakan link TikTok, Instagram, atau YouTube.",
          true
        );

        return;

      }


      /*
        Cek platform
      */

      if (
        detectedPlatform !==
        selectedPlatform
      ) {

        showStatus(
          "Link ini terdeteksi sebagai " +
          detectedPlatform.toUpperCase() +
          ".",
          true
        );

        return;

      }


      /*
        Mulai loading
      */

      setLoading(true);


      try {

        /*
          1. CHECK SERVER
        */

        const infoResponse =
          await fetch(
            API_BASE +
            "/api/info",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url: url
                })
            }
          );


        /*
          Server error
        */

        if (
          !infoResponse.ok
        ) {

          let message =
            "Server gagal memproses link.";

          try {

            const data =
              await infoResponse.json();

            if (
              data &&
              data.error
            ) {

              message =
                data.error;

            }

          } catch {

            // ignore

          }

          throw new Error(
            message
          );

        }


        /*
          Ambil info
        */

        const info =
          await infoResponse.json();


        showStatus(
          "Video ditemukan. Memulai download...",
          false
        );


        /*
          2. DOWNLOAD
        */

        const downloadUrl =
          API_BASE +
          "/api/download?url=" +
          encodeURIComponent(url);


        const downloadResponse =
          await fetch(
            downloadUrl,
            {
              method: "GET"
            }
          );


        /*
          Download gagal
        */

        if (
          !downloadResponse.ok
        ) {

          let message =
            "Download gagal.";

          try {

            const data =
              await downloadResponse.json();

            if (
              data &&
              data.error
            ) {

              message =
                data.error;

            }

          } catch {

            // ignore

          }

          throw new Error(
            message
          );

        }


        /*
          Ambil file
        */

        const blob =
          await downloadResponse.blob();


        if (
          !blob ||
          blob.size <= 0
        ) {

          throw new Error(
            "File video kosong."
          );

        }


        /*
          Buat link download
        */

        const blobUrl =
          URL.createObjectURL(
            blob
          );


        const downloadLink =
          document.createElement(
            "a"
          );


        downloadLink.href =
          blobUrl;

        downloadLink.download =
          "Rexcvc-Video.mp4";

        downloadLink.style.display =
          "none";


        document.body.appendChild(
          downloadLink
        );


        downloadLink.click();


        /*
          Bersihkan
        */

        setTimeout(
          function () {

            downloadLink.remove();

            URL.revokeObjectURL(
              blobUrl
            );

          },
          3000
        );


        showStatus(
          "Download selesai.",
          false
        );

      } catch (error) {

        console.error(
          "REXCVC ERROR:",
          error
        );


        let message =
          error &&
          error.message
            ? error.message
            : "Terjadi kesalahan.";


        if (
          message
            .toLowerCase()
            .includes(
              "failed to fetch"
            )
        ) {

          message =
            "Tidak dapat terhubung ke server Rexcvc.";

        }


        showStatus(
          message,
          true
        );

      } finally {

        setLoading(false);

      }

    }
  </script>

</body>
</html>
