<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REXCVC Downloader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #111111;
      --muted: #777777;
      --border: #dddddd;
      --button-top: #eeeeee;
      --button-bottom: #cfcfcf;
      --shadow: #111111;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 42%),
        linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 34px 34px, 34px 34px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(0,0,0,.05);
      border-radius: 50%;
      top: -220px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashOut 1s ease 1.9s forwards;
    }

    .splash-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(80px, 24vw, 180px);
      letter-spacing: 8px;
      color: #ffffff;
      transform: translateY(100px) scale(.75);
      opacity: 0;
      animation: splashTitle 1.5s cubic-bezier(.16,1,.3,1) .2s forwards;
    }

    @keyframes splashTitle {
      0% {
        transform: translateY(100px) scale(.75);
        opacity: 0;
      }

      60% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(-10px) scale(1);
        opacity: 1;
      }
    }

    @keyframes splashOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    .page {
      width: min(100%, 920px);
      margin: auto;
      padding: 28px 18px 50px;
    }

    header {
      padding: 12px 4px 30px;
      text-align: center;
    }

    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(58px, 16vw, 105px);
      line-height: .85;
      letter-spacing: 5px;
    }

    .subtitle {
      margin-top: 13px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #8a8a8a;
    }

    .line {
      width: 70px;
      height: 3px;
      margin: 18px auto 0;
      background: #111111;
    }

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow:
        0 2px 0 #ffffff inset,
        0 14px 30px rgba(0,0,0,.055);
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0,0,0,.18),
        transparent
      );
    }

    .platform {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px;
      margin-bottom: 7px;
    }

    .description {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #d5d5d5;
      background: #f8f8f8;
      color: #111;
      outline: none;
      font-size: 13px;
      transition: .2s ease;
    }

    input:focus {
      border-color: #111;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    input::placeholder {
      color: #999;
    }

    button {
      font-family: Inter, Arial, sans-serif;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .paste-btn {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 15px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      background: #ededed;
      color: #111;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 3px 0 #111;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .paste-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #111;
    }

    .download-btn {
      width: 100%;
      height: 50px;
      margin-top: 13px;
      border-radius: 11px;
      background: linear-gradient(
        to bottom,
        var(--button-top),
        var(--button-bottom)
      );
      color: #111;
      border: 1px solid #c5c5c5;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .4px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 5px 0 var(--shadow);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .download-btn:active {
      transform: translateY(5px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 0 0 var(--shadow);
    }

    .download-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 3px 0 #777;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 11px;
      color: #777;
      line-height: 1.5;
    }

    .status.loading {
      color: #111;
    }

    .status.error {
      color: #b00020;
    }

    .status.success {
      color: #16733a;
    }

    footer {
      text-align: center;
      padding: 35px 0 0;
      color: #999;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .footer-brand {
      color: #555;
      font-weight: 800;
    }

    @media (min-width: 700px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .card {
        padding: 22px;
      }

      .input-row {
        display: block;
      }

      .paste-btn {
        width: 100%;
        margin-top: 8px;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        padding: 18px;
      }

      .input-row {
        gap: 6px;
      }

      .paste-btn {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH -->
  <div class="splash">
    <div class="splash-title">REXCVC</div>
  </div>

  <main class="page">

    <!-- HEADER -->
    <header>
      <div class="brand">REXCVC</div>
      <div class="subtitle">READY TO DOWNLOAD</div>
      <div class="line"></div>
    </header>

    <!-- PLATFORM CARDS -->
    <section class="cards">

      <!-- TIKTOK -->
      <div class="card">
        <div class="platform">TikTok</div>
        <div class="description">
          Masukkan link video TikTok untuk mulai mengunduh.
        </div>

        <div class="input-row">
          <input
            id="tiktokInput"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://www.tiktok.com/..."
          >

          <button
            class="paste-btn"
            type="button"
            onclick="pasteLink('tiktokInput','tiktokStatus')"
          >
            Paste
          </button>
        </div>

        <button
          class="download-btn"
          type="button"
          onclick="downloadVideo('tiktokInput','tiktokStatus',this)"
        >
          Download Video
        </button>

        <div id="tiktokStatus" class="status"></div>
      </div>


      <!-- INSTAGRAM -->
      <div class="card">
        <div class="platform">Instagram</div>
        <div class="description">
          Masukkan link Reels atau video Instagram untuk mulai mengunduh.
        </div>

        <div class="input-row">
          <input
            id="instagramInput"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://www.instagram.com/..."
          >

          <button
            class="paste-btn"
            type="button"
            onclick="pasteLink('instagramInput','instagramStatus')"
          >
            Paste
          </button>
        </div>

        <button
          class="download-btn"
          type="button"
          onclick="downloadVideo('instagramInput','instagramStatus',this)"
        >
          Download Video
        </button>

        <div id="instagramStatus" class="status"></div>
      </div>


      <!-- YOUTUBE -->
      <div class="card">
        <div class="platform">YouTube</div>
        <div class="description">
          Masukkan link video YouTube untuk mulai mengunduh.
        </div>

        <div class="input-row">
          <input
            id="youtubeInput"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://www.youtube.com/..."
          >

          <button
            class="paste-btn"
            type="button"
            onclick="pasteLink('youtubeInput','youtubeStatus')"
          >
            Paste
          </button>
        </div>

        <button
          class="download-btn"
          type="button"
          onclick="downloadVideo('youtubeInput','youtubeStatus',this)"
        >
          Download Video
        </button>

        <div id="youtubeStatus" class="status"></div>
      </div>

    </section>

    <footer>
      <span class="footer-brand">REXCVC</span>
      &nbsp;•&nbsp;
      VIDEO DOWNLOADER
    </footer>

  </main>


  <script>
    /*
      =====================================================
      REXCVC BACKEND
      =====================================================
    */

    const API_BASE = "https://rexcvc-f1l1rbr.cranl.net";


    /*
      =====================================================
      PASTE
      =====================================================
    */

    async function pasteLink(inputId, statusId) {
      const input = document.getElementById(inputId);
      const status = document.getElementById(statusId);

      try {
        const text = await navigator.clipboard.readText();

        if (!text) {
          status.textContent = "Clipboard kosong.";
          status.className = "status error";
          return;
        }

        input.value = text.trim();

        status.textContent = "Link berhasil ditempel.";
        status.className = "status success";

      } catch (error) {

        status.textContent =
          "Paste otomatis tidak tersedia. Tekan lama kolom lalu pilih Paste.";

        status.className = "status error";

        input.focus();
      }
    }


    /*
      =====================================================
      CEK URL
      =====================================================
    */

    function getPlatform(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.toLowerCase();

        if (
          host === "youtube.com" ||
          host === "www.youtube.com" ||
          host === "youtu.be" ||
          host === "m.youtube.com"
        ) {
          return "youtube";
        }

        if (
          host === "tiktok.com" ||
          host === "www.tiktok.com" ||
          host === "vm.tiktok.com"
        ) {
          return "tiktok";
        }

        if (
          host === "instagram.com" ||
          host === "www.instagram.com"
        ) {
          return "instagram";
        }

        return null;

      } catch {
        return null;
      }
    }


    /*
      =====================================================
      DOWNLOAD
      =====================================================
    */

    async function downloadVideo(inputId, statusId, button) {

      const input = document.getElementById(inputId);
      const status = document.getElementById(statusId);

      const url = input.value.trim();

      if (!url) {
        status.textContent = "Masukkan link terlebih dahulu.";
        status.className = "status error";
        input.focus();
        return;
      }

      const platform = getPlatform(url);

      if (!platform) {
        status.textContent =
          "Link tidak dikenali. Gunakan link TikTok, Instagram, atau YouTube.";

        status.className = "status error";
        return;
      }


      /*
        Tombol loading
      */

      button.disabled = true;
      button.textContent = "Memproses...";

      status.textContent =
        "Sedang mengambil video. Mohon tunggu...";

      status.className = "status loading";


      try {

        /*
          Cek backend terlebih dahulu
        */

        const response = await fetch(
          API_BASE +
          "/api/info?url=" +
          encodeURIComponent(url),
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: url
            })
          }
        );


        /*
          Jika backend mengembalikan error
        */

        if (!response.ok) {

          let message =
            "Video tidak dapat diproses.";

          try {
            const data = await response.json();

            if (data.error) {
              message = data.error;
            }

          } catch {}

          throw new Error(message);
        }


        const info = await response.json();


        /*
          Tampilkan informasi video
        */

        if (info.title) {

          status.textContent =
            "Video ditemukan: " +
            info.title +
            ". Menyiapkan download...";

        } else {

          status.textContent =
            "Video ditemukan. Menyiapkan download...";

        }


        /*
          Buat URL download
        */

        const downloadUrl =
          API_BASE +
          "/api/download?url=" +
          encodeURIComponent(url);


        /*
          Buka endpoint download
        */

        const link = document.createElement("a");

        link.href = downloadUrl;
        link.target = "_blank";
        link.rel = "noopener";

        document.body.appendChild(link);

        link.click();

        link.remove();


        status.textContent =
          "Download dimulai. Jika halaman baru terbuka, tunggu prosesnya selesai.";

        status.className = "status success";


      } catch (error) {

        console.error(error);

        status.textContent =
          error.message ||
          "Gagal memproses video. Coba link lain.";

        status.className = "status error";

      } finally {

        button.disabled = false;
        button.textContent = "Download Video";

      }
    }


    /*
      =====================================================
      ENTER KEY
      =====================================================
    */

    document.querySelectorAll("input").forEach(input => {

      input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          const button =
            this.closest(".card")
              .querySelector(".download-btn");

          button.click();
        }

      });

    });
  </script>

</body>
</html>
