<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rexcvc Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Outfit,sans-serif}body{min-height:100vh;color:#111827;background:radial-gradient(circle at 10% 10%,#dbeafe 0,transparent 30%),radial-gradient(circle at 90% 20%,#fce7f3 0,transparent 28%),radial-gradient(circle at 50% 100%,#e0e7ff 0,transparent 35%),#fff;overflow-x:hidden}.bg{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;z-index:-1}.s1{width:170px;height:170px;background:#93c5fd;top:-50px;left:-50px}.s2{width:180px;height:180px;background:#f9a8d4;right:-70px;top:35%}.s3{width:160px;height:160px;background:#a5b4fc;bottom:-70px;left:30%}
.welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#dbeafe,transparent 35%),radial-gradient(circle at 80% 80%,#fce7f3,transparent 35%),#fff;z-index:99;animation:out 1s ease 2.8s forwards}.welcome:before,.welcome:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(45px);opacity:.45}.welcome:before{background:#60a5fa;top:10%;left:5%}.welcome:after{background:#f472b6;right:5%;bottom:10%}.welcome h1{font:400 clamp(32px,9vw,58px) Pacifico,cursive;background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);-webkit-background-clip:text;color:transparent;animation:txt 2.4s cubic-bezier(.65,0,.35,1) forwards}.line{width:0;height:3px;margin:15px auto 0;border-radius:20px;background:linear-gradient(90deg,#2563eb,#ec4899);animation:line 1s ease 1s forwards}@keyframes txt{0%{opacity:0;transform:translateY(120px) scale(.9)}25%,70%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-110px) scale(1.05)}}@keyframes line{to{width:90px}}@keyframes out{to{opacity:0;visibility:hidden;pointer-events:none}}
.container{width:100%;max-width:650px;margin:auto;padding:38px 18px 55px;opacity:0;transform:translateY(25px);animation:main .8s ease 3s forwards}@keyframes main{to{opacity:1;transform:none}}.header{text-align:center;margin-bottom:30px}.logo{font-size:34px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);-webkit-background-clip:text;color:transparent}.subtitle{margin-top:7px;font-size:14px;color:#6b7280}.card{position:relative;padding:20px;margin-bottom:18px;border-radius:22px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);box-shadow:0 15px 40px rgba(15,23,42,.07);backdrop-filter:blur(15px);transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 20px 45px rgba(15,23,42,.11)}.card:before{content:"";position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 10px 10px}.tiktok:before{background:linear-gradient(90deg,#25f4ee,#111,#fe2c55)}.instagram:before{background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045)}.youtube:before{background:#f00}.title{font-size:18px;font-weight:700;margin-bottom:13px}.input{display:flex;align-items:center;gap:6px;padding:6px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:15px}.input input{flex:1;min-width:0;padding:12px 10px;border:0;outline:0;background:transparent;font-size:14px}.paste{border:0;padding:10px 14px;border-radius:11px;background:#111827;color:white;font-size:13px;font-weight:600;cursor:pointer}.paste.success{background:#059669}.status{display:block;height:0;opacity:0;overflow:hidden;margin-left:5px;font-size:12px;font-weight:500;color:#10b981;transition:.25s}.status.show{height:18px;opacity:1;margin-top:7px}.download{width:100%;margin-top:12px;padding:13px;border:0;border-radius:13px;color:#fff;font-weight:700;cursor:pointer}.tiktok .download{background:linear-gradient(135deg,#111827,#374151)}.instagram .download{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.youtube .download{background:linear-gradient(135deg,#f00,#dc2626)}.download:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;background:#fef2f2;color:#b91c1c;font-size:13px}.error.show{display:block}.result{display:none;margin-top:18px;padding:18px;border-radius:20px;background:rgba(255,255,255,.9);border:1px solid #e5e7eb;box-shadow:0 15px 40px rgba(15,23,42,.07)}.result.show{display:block}.result video{width:100%;max-height:380px;border-radius:14px;background:#111}.result-title{font-weight:700;margin:12px 0 8px}.result-meta{font-size:13px;color:#6b7280}.result a{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:#111827;color:#fff;text-decoration:none;font-weight:700}.footer{text-align:center;margin-top:28px;color:#9ca3af;font-size:12px}@media(max-width:480px){.container{padding:30px 14px 45px}.card{padding:17px}.welcome h1{font-size:38px}.input input{font-size:13px}.paste{padding:10px 12px}}
</style>
</head>
<body>
<div class="bg s1"></div><div class="bg s2"></div><div class="bg s3"></div>
<div class="welcome"><div><h1>Welcome to Rexcvc</h1><div class="line"></div></div></div>
<main class="container"><header class="header"><div class="logo">Rexcvc</div><div class="subtitle">Download video yang kamu punya hak untuk mengunduh</div></header>
<div class="card tiktok"><div class="title">TikTok</div><div class="input"><input id="tiktok" placeholder="Tempel link TikTok di sini..."><button id="tiktokBtn" class="paste" onclick="pasteLink('tiktok')">Tempel</button></div><span id="tiktokStatus" class="status">✓ Link berhasil ditempel</span><button class="download" onclick="processVideo('tiktok')">Proses TikTok</button></div>
<div class="card instagram"><div class="title">Instagram</div><div class="input"><input id="instagram" placeholder="Tempel link Instagram di sini..."><button id="instagramBtn" class="paste" onclick="pasteLink('instagram')">Tempel</button></div><span id="instagramStatus" class="status">✓ Link berhasil ditempel</span><button class="download" onclick="processVideo('instagram')">Proses Instagram</button></div>
<div class="card youtube"><div class="title">YouTube</div><div class="input"><input id="youtube" placeholder="Tempel link YouTube di sini..."><button id="youtubeBtn" class="paste" onclick="pasteLink('youtube')">Tempel</button></div><span id="youtubeStatus" class="status">✓ Link berhasil ditempel</span><button class="download" onclick="processVideo('youtube')">Proses YouTube</button></div>
<div id="error" class="error"></div><section id="result" class="result"><video id="preview" controls></video><div id="resultTitle" class="result-title"></div><div id="resultMeta" class="result-meta"></div><a id="downloadLink" href="#" download>Download file</a></section><div class="footer">© 2026 Rexcvc</div></main>
<script src="config.js"></script>
<script>
function apiUrl(path){const base=(window.REXCVC_API_BASE_URL||'').replace(/\/$/,'');return base+path}
async function pasteLink(id){const b=document.getElementById(id+'Btn'),s=document.getElementById(id+'Status'),i=document.getElementById(id);try{const t=await navigator.clipboard.readText();if(!t){s.textContent='Clipboard kosong';s.style.color='#f59e0b';s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1500);return}i.value=t;b.textContent='✓ Berhasil';b.classList.add('success');s.textContent='✓ Link berhasil ditempel';s.style.color='#10b981';s.classList.add('show');setTimeout(()=>{b.textContent='Tempel';b.classList.remove('success')},1500);setTimeout(()=>s.classList.remove('show'),2000)}catch(e){s.textContent='Clipboard tidak bisa diakses';s.style.color='#ef4444';s.classList.add('show');setTimeout(()=>s.classList.remove('show'),2000)}}
async function processVideo(platform){const i=document.getElementById(platform),url=i.value.trim(),err=document.getElementById('error'),res=document.getElementById('result');err.classList.remove('show');res.classList.remove('show');if(!url){err.textContent='Masukkan link terlebih dahulu.';err.classList.add('show');return}const b=i.closest('.card').querySelector('.download');b.disabled=true;b.textContent='Memproses...';try{const r=await fetch(apiUrl('/api/download'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,url})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memproses link.');document.getElementById('preview').src=d.url;document.getElementById('downloadLink').href=d.url;document.getElementById('resultTitle').textContent=d.title||'Video siap diunduh';document.getElementById('resultMeta').textContent=d.message||'File berhasil diproses.';res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){err.textContent=e.message;err.classList.add('show')}finally{b.disabled=false;b.textContent='Proses '+platform[0].toUpperCase()+platform.slice(1)}}
</script>
</body></html>
